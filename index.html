<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarjeta AR - Hector Fernando</title>
    
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      .btn-cambio {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        padding: 12px 24px; background: #00FF00; color: #000; font-weight: bold;
        border: none; border-radius: 8px; z-index: 9999; cursor: pointer;
        font-family: sans-serif; box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Botón para ir al rastreador de video -->
    <button class="btn-cambio" onclick="window.location.href='/tarjeta-ar/video.html'">
      Cambiar a Escáner de Imagen (Video)
    </button>

    <a-scene 
        vr-mode-ui="enabled: false;" 
        renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true;"
        embedded 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <a-assets>
        <!-- CARGAMOS LA IMAGEN Q-->
        <img id="foto-mostrar" src="/tarjeta-ar/mi-imagen.png">
      </a-assets>

      <a-marker preset="hiro">
        <a-entity rotation="-90 0 0">
          <a-plane position="0 0.5 0" width="2.8" height="1.6" color="#111" material="opacity: 0.9"></a-plane>
          <a-text value="HECTOR FERNANDO" color="#FFF" align="center" position="0 1.0 0.1" width="4"></a-text>
          <a-text value="GAYTAN MARQUEZ" color="#FFF" align="center" position="0 0.75 0.1" width="4"></a-text>
          <a-text value="Estudiante de Ing. en Computacion - UAZ\nExperiencia con IA" color="#00FF00" align="center" position="0 0.4 0.1" width="2"></a-text>
          <a-text value="Tel: +52 492 218 8923\nhectorfernandogaytanmarquez@gmail.com" color="#8DF" align="center" position="0 0.05 0.1" width="1.8"></a-text>
        </a-entity>
      </a-marker>

      <a-marker type="barcode" value="6">

        <a-image src="#foto-mostrar" rotation="-90 0 0" position="0 0.5 0" width="2" height="2"></a-image>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
