<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portafolio AR - Video</title>
    
    <!-- Versiones originales de tu código NFT -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js'></script>
    
    <script>
        window.onload = function() {
            AFRAME.registerComponent('videohandler', {
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector("#vid");

                    marker.addEventListener('markerFound', function () {
                        this.vid.play();
                    }.bind(this));

                    marker.addEventListener('markerLost', function() {
                        this.vid.pause();
                        this.vid.currentTime = 0;
                    }.bind(this));
                }
            });
        };
    </script>
    <style>
        .arjs-loader {
            height: 100%; width: 100%; position: absolute;
            top: 0; left: 0; background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }
        .arjs-loader div { color: white; font-family: sans-serif; font-size: 1.2em; }
        .btn-volver {
            position: absolute; top: 20px; left: 20px;
            padding: 10px 15px; background: #FF3333; color: #FFF; border: none; font-weight: bold;
            z-index: 10000; cursor: pointer; border-radius: 5px; font-family: sans-serif; box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body style='margin : 0px; overflow: hidden;'>
    
    <div class="arjs-loader">
        <div>Cargando rastreador de imagen...</div>
    </div>

    <button class="btn-volver" onclick="window.location.href='./index.html'">Volver a Marcadores</button>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <video src="./mov_bbb.mp4" preload="auto" id="vid" response-type="arraybuffer" loop crossorigin webkit-playsinline autoplay muted playsinline></video>
        </a-assets>

        <a-nft
            videohandler
            type='nft' 
            url='/tarjeta-ar/Ar31/nft-video/nftdata/images'
            smooth="true" smoothCount="20" smoothTolerance="0.05" smoothThreshold="10">
            
            <a-video
                src="#vid"
                position='50 150 -100'
                rotation='90 0 180'
                width='175'
                height='300'>
            </a-video>
        </a-nft>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
